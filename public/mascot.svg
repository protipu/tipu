<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F1F5F9"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <rect x="20" y="35" width="60" height="45" rx="12" fill="url(#bodyGrad)"/>
  <!-- Head -->
  <circle cx="50" cy="30" r="22" fill="url(#bodyGrad)"/>
  <!-- Face plate -->
  <ellipse cx="50" cy="32" rx="16" ry="14" fill="url(#faceGrad)"/>
  <!-- Eyes -->
  <circle cx="43" cy="30" r="4" fill="#1E293B"/>
  <circle cx="57" cy="30" r="4" fill="#1E293B"/>
  <circle cx="44" cy="29" r="1.5" fill="white"/>
  <circle cx="58" cy="29" r="1.5" fill="white"/>
  <!-- Smile -->
  <path d="M 43 38 Q 50 44 57 38" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Antenna -->
  <line x1="50" y1="8" x2="50" y2="14" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="6" r="4" fill="#60A5FA"/>
  <!-- Arms -->
  <rect x="8" y="45" width="12" height="20" rx="6" fill="url(#bodyGrad)"/>
  <rect x="80" y="45" width="12" height="20" rx="6" fill="url(#bodyGrad)"/>
  <!-- Chest detail -->
  <circle cx="50" cy="55" r="6" fill="#60A5FA"/>
  <circle cx="50" cy="55" r="3" fill="white"/>
</svg>